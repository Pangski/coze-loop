name: Thrift Syntax Validation

on: 
  push:
    paths:
      - 'idl/**'
      - '.github/workflows/idl.yaml'
  pull_request:
    paths:
      - 'idl/**'
      - '.github/workflows/idl.yaml'

jobs:
  validate-thrift:
    name: 🧪 Validate Thrift Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: 📦 Install Kitex Tools
        run: |
          go install github.com/cloudwego/thriftgo@v0.4.1
          go install github.com/cloudwego/kitex/tool/cmd/kitex@v0.13.1
          go install github.com/cloudwego/thrift-gen-validator@v0.2.6

      - name: ✅ Validate Thrift Files
        run: |
          set -euo pipefail

          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT
          echo "Using temporary directory: $TEMP_DIR"

          ERROR_FOUND=0

          for thrift_file in $(find "$GITHUB_WORKSPACE/idl" -name '*.thrift'); do
            echo "🔍 Validating $thrift_file..."
            if ! kitex -streamx -thrift ignore_initialisms=false -module=temp "$thrift_file" > "$TEMP_DIR/output.log" 2>&1; then
              echo "❌ Error in $thrift_file:"
              cat "$TEMP_DIR/output.log"
              echo ""
              ERROR_FOUND=1
            else
              echo "✅ $thrift_file passed validation"
            fi
          done

          if [ $ERROR_FOUND -eq 1 ]; then
            echo "❗ Thrift validation failed for one or more files."
            exit 1
          else
            echo "🎉 All Thrift files validated successfully!"
          fi
