name: CI@backend

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'
  pull_request:
    branches: ["main"]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'

jobs:
  golang-lint:
    name: 🧹 Golang Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"

      - name: 📦 Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.2.1
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: 🧪 Run golangci-lint
        run: golangci-lint run --config ../.github/.golangci.yaml

  build-and-unittest:
    name: 🛠️ Build & 🧪 Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"

      - name: 🏗️ Build Project
        run: go build -v ./...

      - name: 🧪 Run Unit Tests with Coverage
        run: |
          go test -gcflags="all=-N -l" -race -v -coverprofile=coverage.out -coverpkg=./... ./...

      - name: 📈 Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          slug: coze-dev/cozeloop
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
